services:
  survey:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8080}:3000"
      - "${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_HOST_PORT:-8081}:3001"
    environment:
      PUBLIC_URL: "${PUBLIC_URL:-}"
      ADMIN_PORT: "3001"
      DB_PATH: /data/survey.sqlite
    volumes:
      - survey-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  survey-data:
