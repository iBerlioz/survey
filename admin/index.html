<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ответы на зачёт</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div><p class="eyebrow">АДМИНИСТРАТОР</p><h1>Ответы на зачёт</h1></div><nav><button id="refresh">Обновить</button><a href="./export.csv">Скачать CSV</a><a href="./export.json">JSON</a></nav></header><p id="status" role="status">Загрузка…</p><section id="stats" class="stats"></section><p id="duplicates-summary" class="duplicates-summary" aria-live="polite"></p><label class="duplicates-toggle"><input type="checkbox" id="duplicates-only"> Только ФИО с повторами</label><label class="duplicates-toggle"><input type="checkbox" id="custom-topics-only"> Только свои темы</label><div class="filters"><input type="search" id="search" aria-label="Поиск по ФИО и теме" placeholder="Поиск по ФИО и теме"><select id="format" aria-label="Форма зачёта"><option value="">Все формы зачёта</option></select></div><div class="table-wrap"><table><thead><tr><th>ФИО</th><th>Форма зачёта</th><th>Тема презентации</th><th>Отправлено</th><th>Круг</th><th>Действия</th></tr></thead><tbody id="rows"></tbody></table></div><p id="count"></p></main><dialog id="editor"><form id="edit-form"><h2>Исправить запись</h2><label>ФИО<input id="edit-name" required maxlength="200"></label><label>Форма зачёта<select id="edit-format"></select></label><label>Тема<textarea id="edit-topic" required maxlength="500" rows="5"></textarea></label><p id="edit-error" role="alert"></p><button type="submit">Сохранить</button> <button id="cancel" type="button">Отмена</button></form></dialog><script src="./admin.js" defer></script></body></html>
